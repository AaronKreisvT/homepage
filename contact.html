<!doctype html>
<html lang="en">

  <body data-page="contact">

    <main class="container">
      <h1>Contact</h1>
      <p>Feel free to reach out via one of the following platforms:</p>

      <ul class="contact-list">
        <li>
          <img src="assets/icons/mail.svg" alt="Mail" class="contact-icon" />
          <a href="mailto:aaron@kreisaaron.de">aaron@kreisaaron.de</a>
        </li>
        <li>
          <img
            src="assets/icons/github.svg"
            alt="GitHub"
            class="contact-icon"
          />
          <a
            href="https://github.com/AaronKreisvT"
            target="_blank"
            rel="noopener"
            >AaronKreisvT</a
          >
        </li>
        <li>
          <img
            src="assets/icons/linkedin.svg"
            alt="LinkedIn"
            class="contact-icon"
          />
          <a
            href="https://www.linkedin.com/in/kreisaaron"
            target="_blank"
            rel="noopener"
            >Aaron Kreis</a
          >
        </li>
        <li>
          <img
            src="assets/icons/researchgate.svg"
            alt="ResearchGate"
            class="contact-icon"
          />
          <a
            href="https://www.researchgate.net/profile/Aaron-Kreis"
            target="_blank"
            rel="noopener"
            >Aaron Kreis</a
          >
        </li>
        <li>
          <a
            href="https://orcid.org/0009-0008-2515-2365"
            target="_blank"
            rel="me noopener noreferrer"
          >
            <img
              src="https://info.orcid.org/wp-content/uploads/2020/12/ORCIDiD_icon16x16.png"

              width="16"
              height="16"
            />

      </ul>
    </main>
    <div id="lightbox" class="lightbox">

    </div>
    <div data-include="partials/footer.html"></div>
